<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- declared before any stylesheet, so the native half of the UI (form
     controls, scrollbars, the caret) is dark from the first paint rather
     than from the first rule -->
<meta name="color-scheme" content="dark">
<title>MemAI · Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='7' y='7' width='18' height='18' rx='2' transform='rotate(45 16 16)' fill='none' stroke='%23BB86FC' stroke-width='2'/><circle cx='16' cy='16' r='3' fill='%23BB86FC'/></svg>">
<!-- Generated, not static: it names a font file only when that file has
     actually been fetched (tools/fetch-fonts.py), so the optional half of
     the font setup cannot log 404s. Installed copy first, then
     webui/fonts/, then the system stack. Nothing here reaches the network
     -- the rest of MemAI runs offline and this page is served from
     loopback. -->
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="./admin.css">
</head>
<body>

<aside class="rail">
  <!-- Icons are drawn from webui/core/icons.js into these empty <svg>
       elements at boot. They ship empty rather than absent so admin.css
       sizes the box from first paint and filling it cannot shift the
       layout -- same reason data-i18n swaps text in place. -->
  <div class="brand">
    <svg class="brand-seal" data-icon="brand-seal"></svg>
    <div class="brand-text">
      <!-- the page's h1. It was a span, which left the document with no
           level-one heading and every view's title starting at h2. -->
      <h1 class="brand-name">MemAI</h1>
      <span class="brand-sub" data-i18n="brand.sub">memory administration</span>
    </div>
  </div>

  <!-- data-i18n-title as well as the label: below 940px the rail collapses
       and the labels are sized to nothing, so the tooltip is the only thing
       naming an icon for a sighted user. -->
  <nav class="nav" aria-label="Sections" data-i18n-aria="nav.aria">
    <a href="#/overview" data-view="overview" data-i18n-title="nav.overview">
      <svg data-icon="overview"></svg>
      <span data-i18n="nav.overview">Overview</span></a>
    <a href="#/memories" data-view="memories" data-i18n-title="nav.memories">
      <svg data-icon="memories"></svg>
      <span data-i18n="nav.memories">Memories</span></a>
    <a href="#/graph" data-view="graph" data-i18n-title="nav.graph">
      <svg data-icon="graph"></svg>
      <span data-i18n="nav.graph">Universe</span></a>
    <a href="#/diagrams" data-view="diagrams" data-i18n-title="nav.diagrams">
      <svg data-icon="diagrams"></svg>
      <span data-i18n="nav.diagrams">Diagrams</span></a>
    <a href="#/domains" data-view="domains" data-i18n-title="nav.domains">
      <svg data-icon="domains"></svg>
      <span data-i18n="nav.domains">Domains</span></a>
    <a href="#/maintenance" data-view="maintenance" data-i18n-title="nav.maintenance">
      <svg data-icon="maintenance"></svg>
      <span data-i18n="nav.maintenance">Maintenance</span></a>
    <a href="#/optimization" data-view="optimization" data-i18n-title="nav.optimization">
      <svg data-icon="optimization"></svg>
      <span data-i18n="nav.optimization">Optimization</span></a>
  </nav>

  <div class="rail-foot">
    <!-- which project the dashboard, and every MCP server on this machine,
         reads and writes right now; built and wired in core/projects.js -->
    <div id="railProject" class="rail-health"></div>
    <div id="railHealth" class="rail-health"></div>
  </div>
</aside>

<div class="frame">
  <!-- No search field here. It was a shortcut to the Memories tab and nothing
       else: Enter navigated there, cleared itself on the way, and on that tab
       it sat above a second search field that actually filters and actually
       keeps what you typed. `/` still reaches the search -- it focuses the
       real field now (see app.js). -->
  <header class="topbar">
    <div class="topbar-right">
      <span id="dbBadge" class="db-badge" title=""></span>
      <span id="langHost"></span>
      <button id="btnNew" class="btn btn-solid" data-i18n="topbar.newMemory">+ New memory</button>
    </div>
  </header>

  <!-- the spinner ships in the markup: the modules are fetched, and a shell
       with an empty middle reads as "nothing here" rather than as loading -->
  <main id="view" class="view" tabindex="-1">
    <div class="loading"><span class="spin"></span></div>
  </main>
</div>

<!-- Every dialog in the app lives here, stacked: modals, and the memory
     record, which used to be a drawer welded into this page. See the stack
     in webui/core/ui.js -- markup, labelling and focus are all its job. -->
<div id="modalRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="tip" class="tip" hidden></div>

<noscript>
  <div class="noscript">
    This dashboard is a JavaScript application — it renders every view in the
    browser and talks to the local API. Enable JavaScript for this origin to
    use it.
  </div>
</noscript>

<script>
/* The one classic script on the page, and its whole job is to admit failure.
   A module that 404s or throws while loading leaves the shell painted and
   the middle spinning forever, which is indistinguishable from a slow
   request. Capture phase, because an error on a <script> element does not
   bubble. */
addEventListener('error', function (e) {
  if (!(e.target instanceof HTMLScriptElement)) return;
  var view = document.getElementById('view');
  if (view) view.innerHTML = '<div class="empty">The dashboard could not load '
    + 'its modules. Check the server log, then reload.</div>';
}, true);
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
