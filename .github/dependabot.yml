version: 2

# Weekly grouped updates into dev. The uv ecosystem re-runs each lock's header
# command, keeping its hashes and universal markers.
updates:
  - package-ecosystem: uv
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
