name: Release

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: dev

      # The fast-forward is a step of this job, so one place carries the push
      # that moves main; no workflow listens for the release event.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # Refused when main holds a commit dev does not, which is the point.
      - name: Fast-forward main to the released commit
        if: ${{ steps.release.outputs.release_created }}
        run: git push origin HEAD:main
