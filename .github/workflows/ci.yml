name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    # bash runs each step with -e on both systems; Windows' default pwsh
    # reports only a step's last command, so an earlier failure passes.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # memai.admin serves webui/dist, so the tests that fetch the dashboard
      # skip themselves until it is built.
      - name: Build the dashboard
        run: |
          npm ci
          npm run build

      # The dashboard's behaviour tests, in happy-dom (vitest.config.js).
      - name: Test the dashboard
        run: npm test

      # install.bat's two steps: the checkout, which --require-hashes refuses as
      # an editable, then the hashed lock, checked against its declared ranges.
      - name: Install
        run: |
          python -m pip install --no-deps -e .
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Test
        run: python -m pytest

  comment-lint:
    name: comment lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check every comment in the tree
        run: python3 tools/comment-lint.py --all

  static-checks:
    name: ruff and pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # the pyright package runs the npm release of the checker on this Node
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: |
          python -m pip install --no-deps -e .
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests tools

      - name: Type check
        run: pyright

  node-floor:
    name: dashboard build on the Node floor (22.18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The exact version engines.node declares, so the floor is one CI runs.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"

      - name: Build the dashboard
        run: |
          npm ci
          npm run build

      - name: Type-check the dashboard
        run: npm run typecheck

      - name: Test the dashboard
        run: npm test

      - name: Check the routing golden still matches the canvas
        run: node tools/route-parity.mjs

      - name: Pack the release asset and verify its checksum
        run: |
          python3 tools/package-webui.py --out build
          cd build && sha256sum -c ./*.sha256

  route-parity:
    name: diagram route parity (canvas vs SVG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # engines/diagram-engine.ts and diagram_svg.py must route edges alike: this runs the shared fixture
      # through the canvas and fails when it drifts from tests/fixtures/route-golden.json.
      - name: Check the routing golden still matches the canvas
        run: node tools/route-parity.mjs
