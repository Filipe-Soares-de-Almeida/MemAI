name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    # bash runs each step with -e on both systems; Windows' default pwsh
    # reports only a step's last command, so an earlier failure passes.
    defaults:
      run:
        shell: bash
    steps:
      # The bundled model2vec weights under src/memai/models/ are committed
      # as ordinary blobs -- .gitattributes marks *.safetensors binary and
      # declares no filter -- so a plain checkout has the real files and
      # needs no lfs: true.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # memai/admin.py serves webui/dist, so the tests that fetch the dashboard
      # skip themselves until it is built.
      - name: Build the dashboard
        run: |
          npm ci
          npm run build

      # The dashboard's behaviour tests, in happy-dom (vitest.config.js).
      - name: Test the dashboard
        run: npm test

      # install.bat's two steps: the checkout, which --require-hashes refuses as
      # an editable, then the hashed lock, checked against its declared ranges.
      - name: Install
        run: |
          python -m pip install --no-deps -e .
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Test
        run: python -m pytest

  node-floor:
    name: dashboard build on the Node floor (22.18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The exact version engines.node declares, so the floor is one CI runs.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"

      - name: Build the dashboard
        run: |
          npm ci
          npm run build

      - name: Test the dashboard
        run: npm test

      - name: Check the routing golden still matches the canvas
        run: node tools/route-parity.mjs

      - name: Pack the release asset and verify its checksum
        run: |
          python3 tools/package-webui.py --out build
          cd build && sha256sum -c ./*.sha256

  route-parity:
    name: diagram route parity (canvas vs SVG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # webui/diagram-engine.js routes diagram edges for the canvas and
      # memai/diagram_svg.py routes them for the SVG export, from constants
      # that exist in both languages. This runs the shared fixture through
      # the canvas and compares the routed polylines against
      # tests/fixtures/route-golden.json, which tests/test_diagram_svg.py
      # holds the Python side to. Without --write it re-records nothing and
      # exits non-zero once the two have drifted apart, so editing one
      # renderer and not the other fails here instead of silently drawing a
      # flow the user did not arrange.
      - name: Check the routing golden still matches the canvas
        run: node tools/route-parity.mjs
