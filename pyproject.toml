[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memai"
version = "0.1.0"
description = "Long-term memory MCP server for agentic coding with Claude (SQLite + FTS5 keyword retrieval)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28,<2",
    "starlette>=1.3,<2",
    "uvicorn>=0.50,<0.51",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10"]

[project.scripts]
memai-mcp = "memai.server:main"
memai-admin = "memai.admin:main"
memai-hook = "memai.hook:main"
memai-store = "memai.portable:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
