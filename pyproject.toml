[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memai"
dynamic = ["version"]
description = "Long-term memory MCP server for agentic coding with Claude (SQLite + FTS5 keyword retrieval)"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mcp>=2.2,<2.4",
    "starlette>=1.3,<2",
    "uvicorn>=0.54,<0.55",
]

[project.optional-dependencies]
# starlette.testclient wants httpx2; without it the import falls back to
# httpx and warns.
dev = ["pytest>=9.1,<10", "httpx2>=2.12,<3", "ruff>=0.16,<0.17", "pyright>=1.1.414,<1.2"]

[project.scripts]
memai-mcp = "memai.server:main"
memai-admin = "memai.admin.cli:main"
memai-hook = "memai.hook:main"
memai-store = "memai.portable:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memai"]
# The dashboard build is generated and git-ignored, so hatchling leaves it out
# unless it is named here.
artifacts = ["src/memai/webui/dist/**"]
# The release history is a file the dashboard renders, so it travels with the
# package rather than staying at the root of a checkout.
force-include = { "CHANGELOG.md" = "memai/CHANGELOG.md" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: line length is left to a formatting pass of its own. SIM105 and E731:
# try/except/pass and lambda fakes in tests are the house style.
ignore = ["E501", "SIM105", "E731"]

[tool.pyright]
include = ["src/memai"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.hatch.version]
path = "src/memai/__init__.py"
