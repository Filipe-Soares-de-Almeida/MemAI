[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memai"
version = "0.1.0"
description = "Custom long-term memory MCP server (SQLite + FTS5 + sqlite-vec hybrid retrieval, local model2vec embeddings)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "sqlite-vec>=0.1.9,<0.2",
    "model2vec>=0.8,<0.9",
    "numpy>=2.5,<3",
    "starlette>=1.3,<2",
    "uvicorn>=0.50,<0.51",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10"]

[project.scripts]
memai-mcp = "memai.server:main"
memai-admin = "memai.admin:main"
memai-hook = "memai.hook:main"
memai-store = "memai.portable:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memai"]
artifacts = ["src/memai/models/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
